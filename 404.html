<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — Laís Araujo</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Unbounded:wght@900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #0d0d0d; color: #fff; font-family: Poppins, system-ui, sans-serif; text-align: center; }
    main { display: grid; gap: 20px; justify-items: center; max-width: 520px; }
    .code { font: 900 clamp(64px, 18vw, 120px)/1 Unbounded, Poppins, sans-serif; color: #bdea3c; margin: 0; }
    h1 { font-size: clamp(22px, 5vw, 32px); font-weight: 600; margin: 0; }
    p { color: #b0b0b0; margin: 0; line-height: 1.5; }
    a { display: inline-block; padding: 12px 24px; border-radius: 999px; background: #9747ff; color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { background: #a766ff; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Essa página não existe</h1>
    <p>O link pode estar errado ou a página mudou de endereço.</p>
    <a id="home" href="/">voltar para o portfólio</a>
  </main>
  <script>
    // No GitHub Pages de projeto o site fica em /nome-do-repositorio/; o link aponta para essa raiz.
    if (location.hostname.endsWith('github.io')) {
      const seg = location.pathname.split('/').filter(Boolean)[0];
      document.getElementById('home').href = seg ? '/' + seg + '/' : '/';
    }
  </script>
</body>
</html>
